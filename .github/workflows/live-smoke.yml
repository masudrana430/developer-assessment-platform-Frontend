name: Live Frontend Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "scripts/live-smoke.mjs"
      - ".github/workflows/live-smoke.yml"
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Playwright for QA
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Test deployed frontend and backend
        run: node scripts/live-smoke.mjs
        env:
          FRONTEND_URL: https://developer-assessment-platform-front.vercel.app
          BACKEND_URL: https://developer-assessment-platform.onrender.com
